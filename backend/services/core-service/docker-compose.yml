version: '3.8'

services:
  faratan:
    build: 
      context: ../services/core-service
      dockerfile: Dockerfile
    container_name: core-service
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.faratan.rule=Host(`faratan.localhost`)"
      - "traefik.http.services.faratan.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge